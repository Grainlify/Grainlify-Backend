name: CI

# Scoped to this working branch, not main - production is deployed by hand
# from this exact branch today. Gating automation on an eventual main merge
# (undated, non-trivial given the structural divergence between branches)
# would mean indefinitely more manual deploys. Revisit this trigger if/when
# this branch merges into main.
on:
  push:
    branches: [restore/initial-commit-with-auth-fixes]
  pull_request:
    branches: [restore/initial-commit-with-auth-fixes]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Build, vet, and test
    runs-on: ubuntu-latest
    concurrency:
      group: ci-test-${{ github.ref }}
      cancel-in-progress: true
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: grainlify_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # A migration version is chosen by hand, and two branches choosing the
      # same one is a clean git merge that stops the API from booting:
      # golang-migrate refuses to run with a duplicate version. Nothing about
      # the merge looks wrong, and the failure arrives on the next deploy.
      #
      # The Go test catches a collision already sitting in one tree. This
      # catches it while the number is still free to change, which is the only
      # moment the fix is cheap.
      #
      # Only migrations THIS branch adds are checked, deliberately. Checking
      # every migration would fail every build on collisions between two other
      # branches - a check that is red on arrival is a check somebody turns
      # off, and the branch that has to renumber is the one introducing the
      # duplicate, which is the branch whose CI this is.
      - name: Migration versions do not collide with another branch
        run: |
          git fetch --quiet origin '+refs/heads/*:refs/remotes/origin/*'
          base=$(git merge-base origin/main HEAD 2>/dev/null || echo "")
          if [ -z "$base" ]; then
            echo "No merge base with origin/main; skipping."
            exit 0
          fi
          added=$(git diff --name-only --diff-filter=A "$base"...HEAD -- 'migrations/*.up.sql' || true)
          if [ -z "$added" ]; then
            echo "This branch adds no migrations."
            exit 0
          fi
          fail=0
          for f in $added; do
            b=$(basename "$f" .up.sql)
            version=${b%%_*}
            for ref in $(git branch -r --format='%(refname:short)' | grep -v HEAD); do
              other=$(git ls-tree --name-only "$ref" migrations/ 2>/dev/null \
                        | grep -E "^migrations/${version}_.*\.up\.sql$" | head -1)
              [ -z "$other" ] && continue
              o=$(basename "$other" .up.sql)
              if [ "$o" != "$b" ]; then
                echo "::error file=$f::version $version is already used by '$o' on $ref"
                fail=1
              fi
            done
          done
          if [ "$fail" -ne 0 ]; then
            echo "::error::Renumber to a version free on EVERY branch. A duplicate merges cleanly and then stops the API from starting."
            exit 1
          fi
          echo "Migrations added by this branch collide with nothing."

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.0'
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        env:
          TEST_DB_URL: postgres://postgres:postgres@localhost:5432/grainlify_test?sslmode=disable
          # This job performs a single checkout, so the sibling Aptos-Contracts
          # repository is absent and the Merkle vector drift checks in
          # internal/chain cannot read it.
          #
          # Those checks FAIL rather than skip on a missing sibling, deliberately:
          # a suite that quietly performs fewer checks than the reader believes is
          # the failure mode docs/VERIFICATION-TRAPS.md catalogues. Declaring the
          # absence here makes it reviewable code instead of a silent runtime skip.
          #
          # So this CI run verifies the Go half only. It says NOTHING about the
          # Move contract, whose suite runs in its own repository.
          #
          # The durable fix is to check out Aptos-Contracts as a second step and
          # delete this variable. It has no remote yet; do it when it does.
          GRAINLIFY_SIBLING_REPOS_ABSENT: '1'
        # -p 1 is deliberate, not cosmetic: several integration tests
        # (issue-application state machine, migrations) share this one
        # Postgres database and mutate global state directly
        # (schema_migrations, broad table state between tests). Go's default
        # concurrent-per-package test execution would race on that shared
        # state without -p 1 serializing it.
        run: go test -count=1 -p 1 -cover ./...

  deploy:
    name: Deploy to Railway
    needs: test
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      # Never cancel a deploy mid-flight; queue instead.
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway up --service grainlify --detach

      # railway up --detach returns as soon as the deploy is *triggered*, not
      # once it's actually serving traffic - a build/startup/migration
      # failure after this point would otherwise go unnoticed by CI even
      # though the job shows green. This is what actually verifies the
      # deployed artifact works, not just that it built - a pre-deploy test
      # runs against code, never against the real, live, deployed service,
      # so this is the only place in the pipeline that can catch a
      # production-only failure mode (e.g. the migration-lock incident this
      # was added for: the API can build and "deploy" successfully and still
      # never come up because it hung retrying a stuck lock).
      - name: Smoke test production
        run: |
          echo "Waiting for the new deployment to become healthy..."
          for i in $(seq 1 24); do
            if curl -sf -m 10 https://api.grainlify.com/health > /dev/null; then
              echo "Health check passed on attempt $i"
              break
            fi
            if [ "$i" -eq 24 ]; then
              echo "::error::/health did not return 200 within 2 minutes of deploy"
              exit 1
            fi
            sleep 5
          done

          echo "Checking the GitHub sign-in redirect..."
          location=$(curl -sI -m 10 "https://api.grainlify.com/auth/github/login/start?redirect=https%3A%2F%2Fgrainlify.com" | grep -i "^location:" || true)
          if ! echo "$location" | grep -q "github.com/login/oauth/authorize"; then
            echo "::error::Sign-in redirect is broken - expected a redirect to github.com/login/oauth/authorize, got: $location"
            exit 1
          fi
          echo "Sign-in redirect OK: $location"
